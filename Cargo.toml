[package]
name = "nlrome"
version = "0.1.0"
edition = "2024"
readme = "README.md"
license = "MIT"
authors = ["Gaurav Sablok"]
description = "htt gene machine learning"
homepage = "https://codeberg.org/gsablok/httclass"
repository = "https://codeberg.org/gsablok/httclass"
keywords = ["bioinformatics","genomics"]

[dependencies]
anyhow = "1.0"
axonml = { version = "0.6.2", features = ["full"] }
clap = { version = "4.5.47", features = ["derive"] }
figlet-rs = "0.1.5"
ndarray = "0.16.1"
ndarray-csv = "0.5"
ndarray-glm = "0.1.0"
rand = "0.9.2"
rayon = "1.11.0"
regex = "1.10"
reqwest = { version = "0.11", features = ["blocking"] }
scraper = "0.17"
serde = { version = "1.0.225", features = ["derive"] }
tokio = { version = "1.47.1", features = ["full"] }
